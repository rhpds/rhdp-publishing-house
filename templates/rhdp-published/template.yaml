apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: rhdp-published
  title: RHDP Published Content
  description: Create RHDP published lab or demo with full onboarding workflow
  tags:
    - rhdp-published
    - lab
    - demo
    - devspaces

spec:
  owner: rhdp-team
  type: service

  parameters:
    - title: Onboarding Request
      required:
        - asset_title
        - project_description
        - content_outline
        - learning_objectives
        - content_type
      properties:
        asset_title:
          title: Asset Title
          type: string
          description: Name for your lab/demo
          ui:autofocus: true
          ui:placeholder: "OpenShift AI Workshop"
          ui:help: This will be the display name in the catalog

        project_description:
          title: Description
          type: string
          description: What is this asset and why is it needed? High-level but clear.
          ui:widget: textarea
          ui:options:
            rows: 4
          ui:placeholder: "A hands-on lab teaching developers how to deploy and manage AI workloads on OpenShift using RHOAI"

        content_outline:
          title: Content Outline
          type: string
          description: Rough outline of the modules or sections. Doesn't need to be final — just show the shape of what you're building.
          ui:widget: textarea
          ui:options:
            rows: 8
          ui:placeholder: "Module 1: Introduction to OpenShift AI\nModule 2: Deploying ML Models\nModule 3: Managing Training Workloads"

        learning_objectives:
          title: Learning Objectives
          type: string
          description: What will participants learn or be able to do? Draft quality is fine.
          ui:widget: textarea
          ui:options:
            rows: 6
          ui:placeholder: "- Deploy and manage AI/ML workloads on OpenShift\n- Configure RHOAI for production use\n- Implement MLOps best practices"

        content_type:
          title: Lab or Demo?
          type: string
          enum: [lab, demo]
          enumNames: [Lab, Demo]
          default: lab

        associated_opportunities:
          title: Associated Opportunities
          type: string
          description: Is this associated with any specific sales opportunities, services projects, or marketing campaigns? If so, include the Sales Cloud ID here as well as a description including things like customer name, opportunity dollar amount, etc. Requests with higher value opportunities or revenue will receive higher priority if approved for onboarding to RHDP.
          ui:widget: textarea
          ui:options:
            rows: 3

        sales_play_tdp:
          title: Sales Play / TDP Relevance
          type: string
          description: Which TDP, Sales Play, and/or Sales Tactic is this most relevant to?
          ui:widget: textarea
          ui:options:
            rows: 3
          ui:help: 'Find current Sales Plays and TDPs at: https://saleshub.redhat.com/Link/Content/DC2HcDQDhMFbPGTRcCBX82V9DPcP'

        ai_related:
          title: Is this related to AI?
          type: boolean
          default: false

      dependencies:
        ai_related:
          oneOf:
            - properties:
                ai_related:
                  const: false
                partners_access:
                  title: Should it be available to Partners?
                  type: boolean
                  default: false
                  ui:help: Check if this content should be accessible to Red Hat partners
            - properties:
                ai_related:
                  const: true
                can_use_maas:
                  title: Can you use MaaS?
                  type: boolean
                  default: true
                  ui:help: Model-as-a-Service provides API access to AI models without requiring direct GPU hardware
              dependencies:
                can_use_maas:
                  oneOf:
                    - properties:
                        can_use_maas:
                          const: true
                        maas_models:
                          title: Which model(s) do you need?
                          type: string
                          ui:widget: textarea
                          ui:options:
                            rows: 2
                          ui:help: List the model(s) you need. See available models at https://maas-rhdp-frontend.apps.maas.redhatworkshops.io/models
                          ui:placeholder: "e.g., gpt-4o, claude-3-5-sonnet"
                        partners_access:
                          title: Should it be available to Partners?
                          type: boolean
                          default: false
                          ui:help: Check if this content should be accessible to Red Hat partners
                    - properties:
                        can_use_maas:
                          const: false
                        gpu_justification:
                          title: GPU Justification
                          type: string
                          ui:widget: textarea
                          ui:options:
                            rows: 4
                          ui:help: Onboarding requests that require direct GPU access will require strong justification. Explain why you need direct GPU access and what size GPU you require.
                          ui:placeholder: "Explain why MaaS cannot meet your needs and specify GPU requirements (e.g., A100 80GB for fine-tuning large language models)"
                        partners_access:
                          title: Should it be available to Partners?
                          type: boolean
                          default: false
                          ui:help: Check if this content should be accessible to Red Hat partners
                      required:
                        - gpu_justification

    - title: Project Setup
      required:
        - project_name
        - github_users
        - tags
      properties:
        project_name:
          title: GitHub Repository Name
          type: string
          ui:placeholder: "openshift-ai-workshop"
          pattern: '^[a-z0-9-]+$'
          ui:help: "Choose a meaningful and unique name. The prefix 'ph-' will be automatically prepended (don't add it yourself). Use lowercase letters, numbers, and hyphens only."

        github_users:
          title: GitHub Collaborators
          type: array
          minItems: 1
          ui:help: "Add GitHub usernames for collaborators (at least one required). Your account is added automatically as owner."
          ui:options:
            addable: true
            orderable: false
            removable: true
          items:
            type: object
            required:
              - user
            properties:
              user:
                title: GitHub Username
                type: string
                ui:placeholder: "github-username"
              access:
                title: Access
                type: string
                default: push
                enum: ["push", "pull", "admin", "maintain", "triage"]
                ui:widget: hidden

        tags:
          title: Tags
          type: array
          ui:options:
            addable: true
            orderable: false
            removable: true
          items:
            type: string
            title: Tag
            pattern: "^[a-zA-Z0-9_-]+$"
            ui:placeholder: "e.g. openshift"
          ui:help: "One tag per entry — letters, numbers, hyphens, underscores only"

    - title: Initiative & Technical Details
      required:
        - initiative_key
        - platform
        - showroom_type
      properties:
        initiative_key:
          title: Initiative
          type: string
          enum:
            - none
            - rh1_2027
            - summit_2027
          enumNames:
            - None
            - RH1 2027
            - Summit 2027
          default: none
          ui:help: Which initiative is this content for?

        platform:
          title: What is your lab environment based on?
          type: string
          enum:
            - openshift
            - rhel
          enumNames:
            - OpenShift
            - RHEL
          default: openshift
          ui:help: Choose the base platform for your lab environment

      dependencies:
        platform:
          oneOf:
            - properties:
                platform:
                  const: rhel
                rhel_version:
                  title: RHEL Version
                  type: string
                  enum:
                    - "8"
                    - "9"
                    - "10"
                  enumNames:
                    - "RHEL 8"
                    - "RHEL 9"
                    - "RHEL 10"
                  default: "9"
                  ui:help: Which RHEL version does your lab require?
                showroom_type:
                  title: Showroom Type
                  type: string
                  enum:
                    - classic
                    - zero_touch
                  enumNames:
                    - Classic (standard Showroom)
                    - Zero Touch (embedded automation)
                  default: classic
                  ui:help: Classic = standard Showroom lab. Zero Touch = embedded runtime/setup automation.
            - properties:
                platform:
                  const: openshift
                ocp_version:
                  title: OpenShift Version
                  type: string
                  enum:
                    - "4.20"
                    - "4.21"
                    - "4.22"
                  enumNames:
                    - "4.20"
                    - "4.21"
                    - "4.22"
                  default: "4.21"
                  ui:help: Minimum OpenShift version required

                cloud_service:
                  title: Do you need a cloud-managed OpenShift service?
                  type: string
                  enum:
                    - none
                    - rosa
                    - aro
                  enumNames:
                    - "No - Use standard OpenShift"
                    - "ROSA (Red Hat OpenShift Service on AWS)"
                    - "ARO (Azure Red Hat OpenShift)"
                  default: none
                  ui:help: Cloud-managed services like ROSA or ARO require special justification

                cluster_type:
                  title: Cluster Type
                  type: string
                  enum:
                    - sno
                    - multinode
                  enumNames:
                    - SNO (Single Node)
                    - Multinode
                  default: sno
                  ui:help: Single node for simple labs, multinode for production-like environments

                showroom_type:
                  title: Showroom Type
                  type: string
                  enum:
                    - classic
                    - zero_touch
                  enumNames:
                    - Classic (standard Showroom)
                    - Zero Touch (embedded automation)
                  default: classic
                  ui:help: Classic = standard Showroom lab. Zero Touch = embedded runtime/setup automation.

  steps:
    # Step 1: Check if project name is already taken
    - id: check-catalog
      name: Check Project Name Availability
      action: catalog:fetch
      input:
        entityRef: component:default/ph-${{ parameters.project_name }}
        optional: true

    # Step 2: Start workflow via central API (NO repo creation - happens after pre-intake approval)
    - id: trigger-workflow
      name: Start Publishing House Workflow
      if: ${{ steps['check-catalog'].output.entity == null }}
      action: http:backstage:request
      input:
        method: POST
        path: '/proxy/central-api/projects/ph-${{ parameters.project_name }}/start'
        headers:
          content-type: 'application/json'
        body:
          projectId: ph-${{ parameters.project_name }}
          deploymentMode: rhdp-published
          ssoUser: ${{ user.entity.metadata.name }}
          ssoEmail: ${{ user.entity.spec.profile.email }}
          assetTitle: ${{ parameters.asset_title }}
          projectDescription: ${{ parameters.project_description }}
          contentOutline: ${{ parameters.content_outline }}
          learningObjectives: ${{ parameters.learning_objectives }}
          contentType: ${{ parameters.content_type }}
          associatedOpportunities: ${{ parameters.associated_opportunities }}
          salesPlayTdp: ${{ parameters.sales_play_tdp }}
          aiRelated: ${{ parameters.ai_related }}
          canUseMaas: ${{ parameters.ai_related and parameters.can_use_maas or false }}
          maasModels: ${{ (parameters.ai_related and parameters.can_use_maas and parameters.maas_models) or '' }}
          gpuJustification: ${{ (parameters.ai_related and not parameters.can_use_maas and parameters.gpu_justification) or '' }}
          partnersAccess: ${{ parameters.partners_access or false }}
          platform: ${{ parameters.platform == 'openshift' and 'ocp' or 'rhel-vms' }}
          cloudProvider: ${{ (parameters.ai_related and not parameters.can_use_maas) and 'aws' or (parameters.cloud_service if parameters.cloud_service != 'none' else 'cnv') }}
          clusterType: ${{ parameters.cluster_type or 'sno' }}
          ocpVersion: ${{ parameters.ocp_version or '4.21' }}
          rhelVersion: ${{ parameters.rhel_version or '9' }}
          showroomType: ${{ parameters.showroom_type }}
          initiativeKey: ${{ parameters.initiative_key }}
          teamMembers: ${{ parameters.github_users }}
          tags: ${{ parameters.tags }}
          intakeType: new
          phGitRef: ${{ environment.parameters.phGitRef }}

  output:
    text:
      - title: Result
        content: |
          {% if steps['check-catalog'].output.entity %}
          **Error: Project Already Exists**

          A project named **"ph-${{ parameters.project_name }}"** already exists in the catalog. Please re-run the template with a different project name.
          {% else %}
          **Thank you for your submission!**

          Your onboarding request for **"${{ parameters.asset_title }}"** has been received and is under review.

          We'll be in touch soon about next steps.
          {% endif %}
