apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The single top-level app. Everything else is a child Application it deploys.
  name: publishing-house
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    # Same value drives where the root reads apps-chart AND every child app's source.
    targetRevision: {{ .Values.targetRevision }}
    path: gitops/argocd/apps-chart
    helm:
      parameters:
        - name: repoURL
          value: {{ .Values.repoURL }}
        - name: targetRevision
          value: {{ .Values.targetRevision }}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
  # Secret helm parameters are patched onto the child Applications on the cluster
  # (never committed). Ignore them here so app-of-apps syncs don't wipe them.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
