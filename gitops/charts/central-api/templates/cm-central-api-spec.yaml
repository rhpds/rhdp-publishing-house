apiVersion: v1
data:
  central-api.yaml: "openapi: 3.0.0\ninfo:\n  title: Publishing House Central API\n\
    \  version: 1.0.0\n  description: OpenAPI spec consumed by SonataFlow for workflow\
    \ REST calls\nservers:\n  - url: http://central-api.publishing-house:8000/api/v1\n\
    paths:\n  /jira/epic:\n    post:\n      operationId: createJiraEpic\n      summary:\
    \ Create a Jira epic with rich description and optional ProForma form\n      requestBody:\n\
    \        required: true\n        content:\n          application/json:\n     \
    \       schema:\n              type: object\n              required:\n       \
    \         - workflow_id\n              properties:\n                workflow_id:\n\
    \                  type: string\n                  description: Workflow instance\
    \ ID\n      responses:\n        '200':\n          description: Epic created successfully\n\
    \          content:\n            application/json:\n              schema:\n  \
    \              type: object\n                properties:\n                  epic_key:\n\
    \                    type: string\n                  jira_url:\n             \
    \       type: string\n                  proforma_form_id:\n                  \
    \  type: string\n      security:\n        - bearerAuth: []\n  /jira/epic/update:\n\
    \    post:\n      operationId: updateJiraEpic\n      summary: Update Jira epic\
    \ description and create initial tasks after pre-intake approval\n      requestBody:\n\
    \        required: true\n        content:\n          application/json:\n     \
    \       schema:\n              type: object\n              required:\n       \
    \         - workflow_id\n              properties:\n                workflow_id:\n\
    \                  type: string\n                  description: Workflow instance\
    \ ID\n      responses:\n        '200':\n          description: Epic updated successfully\n\
    \          content:\n            application/json:\n              schema:\n  \
    \              type: object\n                properties:\n                  epic_key:\n\
    \                    type: string\n                  updated:\n              \
    \      type: boolean\n      security:\n        - bearerAuth: []\n  /projects/create-catalog:\n\
    \    post:\n      operationId: createCatalog\n      summary: Create GitHub repository\
    \ from template, sync workflow metadata, and register Backstage catalog\n    \
    \  requestBody:\n        required: true\n        content:\n          application/json:\n\
    \            schema:\n              type: object\n              required:\n  \
    \              - workflow_id\n              properties:\n                workflow_id:\n\
    \                  type: string\n                  description: Workflow instance\
    \ ID\n                repo_owner:\n                  type: string\n          \
    \        default: \"rhpds\"\n                collaborators:\n                \
    \  type: array\n                  items:\n                    type: object\n \
    \                   properties:\n                      user:\n               \
    \         type: string\n                      access:\n                      \
    \  type: string\n      responses:\n        '200':\n          description: Repository\
    \ and catalog created successfully\n          content:\n            application/json:\n\
    \              schema:\n                type: object\n                properties:\n\
    \                  repo_url:\n                    type: string\n             \
    \     commit_hash:\n                    type: string\n                  catalog_registered:\n\
    \                    type: boolean\n      security:\n        - bearerAuth: []\n\
    \  /jira/sync:\n    post:\n      operationId: syncJiraTasks\n      summary: Sync\
    \ Jira tasks from project repo\n      requestBody:\n        required: true\n \
    \       content:\n          application/json:\n            schema:\n         \
    \     type: object\n              required:\n                - workflow_id\n \
    \             properties:\n                workflow_id:\n                  type:\
    \ string\n                  description: Workflow instance ID\n              \
    \  status:\n                  type: string\n                  description: Stage\
    \ completion status (IntakeComplete, EnvSetupComplete, etc.)\n      responses:\n\
    \        '200':\n          description: Jira sync completed\n          content:\n\
    \            application/json:\n              schema:\n                type: object\n\
    \                properties:\n                  epic_key:\n                  \
    \  type: string\n                  tasks_created:\n                    type: integer\n\
    \                  intake_closed:\n                    type: boolean\n      security:\n\
    \        - bearerAuth: []\n  /jira/epic/{epic_key}/preintake-data:\n    get:\n\
    \      operationId: getPreIntakeData\n      summary: Get pre-intake data from\
    \ ProForma form\n      parameters:\n        - name: epic_key\n          in: path\n\
    \          required: true\n          schema:\n            type: string\n     \
    \ responses:\n        '200':\n          description: Pre-intake data retrieved\
    \ successfully\n          content:\n            application/json:\n          \
    \    schema:\n                type: object\n                properties:\n    \
    \              assetTitle:\n                    type: string\n               \
    \   projectDescription:\n                    type: string\n                  contentOutline:\n\
    \                    type: string\n                  learningObjectives:\n   \
    \                 type: string\n                  contentType:\n             \
    \       type: string\n                  audience:\n                    type: string\n\
    \                  duration:\n                    type: string\n             \
    \     prerequisites:\n                    type: string\n                  author:\n\
    \                    type: string\n                  associatedOpportunities:\n\
    \                    type: string\n                  salesPlayTdp:\n         \
    \           type: string\n                  technicalNotes:\n                \
    \    type: string\n      security:\n        - bearerAuth: []\ncomponents:\n  securitySchemes:\n\
    \    bearerAuth:\n      type: http\n      scheme: bearer\n"
kind: ConfigMap
metadata:
  name: central-api-spec
  namespace: publishing-house
  annotations:
    argocd.argoproj.io/sync-wave: '5'
