apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  db:
    database: keycloak
    host: keycloak-db
    passwordSecret:
      key: password
      name: keycloak-db-secret
    port: 5432
    usernameSecret:
      key: username
      name: keycloak-db-secret
    vendor: postgres
  hostname:
    hostname: keycloak-keycloak.{{ .Values.appsDomain }}
  http:
    httpEnabled: true
  instances: 1
  proxy:
    headers: xforwarded
