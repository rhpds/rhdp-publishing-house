apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  name: publishing-house-credentials
  namespace: publishing-house
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/api
      property: api-key
    secretKey: api-key
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/github
      property: token
    secretKey: github-token
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/jira
      property: url
    secretKey: jira-url
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/jira
      property: cloud-id
    secretKey: jira-cloud-id
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/jira
      property: client-id
    secretKey: jira-client-id
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/jira
      property: client-secret
    secretKey: jira-client-secret
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/litellm
      property: api-key
    secretKey: litellm-api-key
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/litellm
      property: url
    secretKey: litellm-url
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/rcars
      property: url
    secretKey: rcars-url
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/rcars
      property: api-key
    secretKey: rcars-api-key
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secrets/ph/central/secrets/ph-internal-ai
      property: api-key
    secretKey: ph-internal-ai-api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: publishing-house-credentials
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
