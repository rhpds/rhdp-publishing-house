apiVersion: v1
kind: ConfigMap
metadata:
  name: ph-developer-hub-dynamic-plugins
  namespace: publishing-house
  labels:
    rhdh.redhat.com/ext-config-sync: 'true'
  annotations:
    rhdh.redhat.com/backstage-name: developer-hub
    argocd.argoproj.io/sync-wave: '6'
data:
  dynamic-plugins.yaml: |
    {{- $c := .Files.Get "files/rhdh-dynamic-plugins.yaml" }}
    {{- $c = $c | replace "__PHWORKFLOWS_VERSION__" (.Values.rhdhPlugins.phWorkflows | toString) }}
    {{- $c = $c | replace "__SCAFFOLDER_VERSION__" (.Values.rhdhPlugins.scaffolderModule | toString) }}
    {{- $c = $c | replace "__README_BACKEND_VERSION__" (.Values.rhdhPlugins.readmeBackend | toString) }}
    {{- $c = $c | replace "__README_VERSION__" (.Values.rhdhPlugins.readme | toString) }}
    {{- $c | nindent 4 }}
