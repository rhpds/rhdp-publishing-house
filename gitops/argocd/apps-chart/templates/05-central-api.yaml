apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: publishing-house-central-api
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops/charts/central-api
    helm:
      parameters:
        - { name: appsDomain, value: apps.ocpv-infra01.dal12.infra.demo.redhat.com }
        - { name: centralApi.image, value: quay.io/rhpds/central-api }
        - { name: centralApi.tag, value: "2.0.0" }
  destination:
    server: https://kubernetes.default.svc
    namespace: publishing-house
  syncPolicy:
    automated: { prune: false, selfHeal: false }
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 10m }
