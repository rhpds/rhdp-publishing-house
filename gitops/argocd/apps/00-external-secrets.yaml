apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: publishing-house-external-secrets
  namespace: openshift-gitops
  annotations:
    # Must be up before the secrets app (ExternalSecret/ClusterSecretStore CRDs).
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Same chart layout as the other components (gitops/charts/<component>).
    # The upstream external-secrets chart is vendored as a Helm dependency.
    repoURL: https://github.com/rhpds/rhdp-publishing-house.git
    targetRevision: main
    path: gitops/charts/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
