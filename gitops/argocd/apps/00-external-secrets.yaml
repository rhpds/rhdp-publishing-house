apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: publishing-house-external-secrets
  namespace: openshift-gitops
  annotations:
    # Wave -1: ESO (CRDs + controller + admission webhook) must be Healthy before
    # the secrets app (wave 1) creates ClusterSecretStore / ExternalSecret CRs.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # ArgoCD-native Helm chart source (not HelmRelease/HelmChartRepository —
    # those are Flux / OpenShift-console constructs, not used by ArgoCD).
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.9.2
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        securityContext:
          runAsNonRoot: true
          runAsUser: null
        webhook:
          securityContext:
            runAsNonRoot: true
            runAsUser: null
        certController:
          securityContext:
            runAsNonRoot: true
            runAsUser: null
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
