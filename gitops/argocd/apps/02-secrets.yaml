apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: publishing-house-secrets
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rhpds/rhdp-publishing-house.git
    targetRevision: main
    path: gitops/charts/ph-secrets
    helm:
      parameters:
        - { name: appsDomain, value: apps.ocpv-infra01.dal12.infra.demo.redhat.com }
        - { name: phCatalogUrl, value: https://github.com/rhpds/rhdp-publishing-house/blob/main/templates/all-locations.yaml }
  destination:
    server: https://kubernetes.default.svc
    namespace: publishing-house
  syncPolicy:
    automated: { prune: false, selfHeal: false }
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 10m }
