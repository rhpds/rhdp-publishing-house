apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: publishing-house-workloads
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rhpds/rhdp-publishing-house.git
    targetRevision: main
    path: gitops/chart
    helm:
      # Only NON-secret values are committed here. Secret parameters are patched
      # onto this Application on the cluster (never committed) — see
      # cluster-secrets/patch-workloads-secrets.sh.
      parameters:
        - { name: appsDomain, value: apps.ocpv-infra01.dal12.infra.demo.redhat.com }
        - { name: centralApi.image, value: quay.io/rhpds/central-api }
        - { name: centralApi.tag, value: "2.0.0" }
        - { name: sonataflow.profile, value: preview }
        - { name: sonataflow.workflowImage, value: image-registry.openshift-image-registry.svc:5000/publishing-house/rhdp-published:latest }
        - { name: rhdhPlugins.phWorkflows, value: "2.0.0" }
        - { name: rhdhPlugins.scaffolderModule, value: "1.1.5" }
        - { name: rhdhPlugins.readme, value: "0.1.0" }
        - { name: rhdhPlugins.readmeBackend, value: "0.1.0" }
        - { name: phCatalogUrl, value: https://github.com/rhpds/rhdp-publishing-house/blob/main/templates/all-locations.yaml }
  destination:
    server: https://kubernetes.default.svc
    namespace: publishing-house
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: rhdp-published
      namespace: publishing-house
      jsonPointers:
        - /spec/template/metadata/annotations/sonataflow.org~1restartedAt
