apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The single top-level app. Everything else is a child Application it deploys.
  name: publishing-house
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rhpds/rhdp-publishing-house.git
    targetRevision: main
    path: gitops/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      # selfHeal off: secret params patched onto the workloads child on the
      # cluster must not be reverted (secrets are never committed to git).
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
