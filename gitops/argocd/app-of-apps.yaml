apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The single top-level app. Everything else is a child Application it deploys.
  name: publishing-house
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rhpds/rhdp-publishing-house.git
    targetRevision: main
    path: gitops/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      # Required so sync honors ignoreDifferences and does NOT overwrite the
      # secret helm parameters patched onto child Applications on the cluster.
      - RespectIgnoreDifferences=true
  # Secret helm parameters are patched onto the child Applications on the cluster
  # (never committed). Ignore them here so app-of-apps syncs don't wipe them.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
