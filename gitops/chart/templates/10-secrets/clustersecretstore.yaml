apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-secret-store
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: rhdh-role
          serviceAccountRef:
            name: vault-auth
            namespace: vault
      path: kv
      server: http://vault.vault.svc:8200
      version: v2
