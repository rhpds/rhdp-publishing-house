apiVersion: v1
kind: Secret
metadata:
  name: ph-developer-hub-env
  namespace: publishing-house
  labels:
    rhdh.redhat.com/ext-config-sync: 'true'
  annotations:
    rhdh.redhat.com/backstage-name: developer-hub
    argocd.argoproj.io/sync-wave: '1'
type: Opaque
stringData:
  # --- non-secret config (derived from appsDomain) ---
  AUTH__OIDC__CLIENT__ID: rhdh
  AUTH__OIDC__METADATA__URL: https://keycloak-keycloak.{{ .Values.appsDomain }}/realms/publishing-house/.well-known/openid-configuration
  BACKEND_URL: https://central-publishing-house-publishing-house.{{ .Values.appsDomain }}
  KEYCLOAK__BASE__URL: https://keycloak-keycloak.{{ .Values.appsDomain }}
  KEYCLOAK__CLIENT__ID: rhdh
  KEYCLOAK__REALM: publishing-house
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
  PH__CATALOG__URL: {{ .Values.phCatalogUrl | quote }}
  # --- secrets (supplied via Application parameters, never committed) ---
  AUTH__OIDC__CLIENT__SECRET: {{ .Values.keycloak.rhdhClientSecret | quote }}
  KEYCLOAK__CLIENT__SECRET: {{ .Values.keycloak.rhdhClientSecret | quote }}
  BACKEND_SECRET: {{ .Values.secrets.developerHubEnv.backendSecret | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.developerHubEnv.githubToken | quote }}
  PH_API_KEY: {{ .Values.secrets.developerHubEnv.phApiKey | quote }}
  RHDH_SERVICE_TOKEN: {{ .Values.secrets.developerHubEnv.rhdhServiceToken | quote }}
  K8S_SERVICEACCOUNT_TOKEN: {{ .Values.secrets.developerHubEnv.k8sServiceAccountToken | quote }}
