apiVersion: v1
kind: Secret
metadata:
  name: sonataflow-console-oauth-proxy
  namespace: publishing-house
  annotations:
    argocd.argoproj.io/sync-wave: '1'
type: Opaque
stringData:
  client-secret: {{ .Values.secrets.consoleOauth.clientSecret | quote }}
  cookie-secret: {{ .Values.secrets.consoleOauth.cookieSecret | quote }}
