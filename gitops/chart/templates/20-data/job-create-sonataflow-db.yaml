apiVersion: batch/v1
kind: Job
metadata:
  name: sonataflow-db-init
  namespace: publishing-house
  annotations:
    # After postgres (wave 2), before the SonataFlow platform/workflow (wave 4+).
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-db
          image: registry.redhat.io/rhel9/postgresql-15:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until pg_isready -h sonataflow-postgresql -p 5432 -U "$PGUSER"; do
                echo "waiting for postgres..."; sleep 3
              done
              if psql -h sonataflow-postgresql -tAc \
                   "SELECT 1 FROM pg_database WHERE datname='sonataflow'" | grep -q 1; then
                echo "database 'sonataflow' already exists"
              else
                echo "creating database 'sonataflow'"
                psql -h sonataflow-postgresql -c "CREATE DATABASE sonataflow"
              fi
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: sonataflow-postgresql-svcbind
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonataflow-postgresql-svcbind
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
