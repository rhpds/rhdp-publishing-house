apiVersion: v1
data:
  input-schema.json: "{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\"\
    ,\n  \"type\": \"object\",\n  \"required\": [\n    \"projectId\"\n  ],\n  \"properties\"\
    : {\n    \"projectId\": {\n      \"type\": \"string\",\n      \"description\"\
    : \"Unique identifier for the publishing project\"\n    },\n    \"repoUrl\": {\n\
    \      \"type\": \"string\",\n      \"description\": \"Git repository URL for\
    \ the content\"\n    },\n    \"ssoUser\": {\n      \"type\": \"string\",\n   \
    \   \"description\": \"SSO/OIDC username of the project owner\"\n    },\n    \"\
    ssoEmail\": {\n      \"type\": \"string\",\n      \"description\": \"SSO/OIDC\
    \ email of the project owner\"\n    },\n    \"deploymentMode\": {\n      \"type\"\
    : \"string\",\n      \"description\": \"Deployment mode (rhdp_published or self_published)\"\
    \n    },\n    \"contentType\": {\n      \"type\": \"string\",\n      \"description\"\
    : \"Content type (workshop, lab, demo)\"\n    },\n    \"tags\": {\n      \"type\"\
    : \"array\",\n      \"items\": {\n        \"type\": \"string\"\n      },\n   \
    \   \"description\": \"Optional tags for filtering and search\"\n    },\n    \"\
    projectDescription\": {\n      \"type\": \"string\",\n      \"description\": \"\
    Brief overview of what the project will deliver\"\n    },\n    \"hasDrift\": {\n\
    \      \"type\": \"boolean\",\n      \"description\": \"Whether design drift was\
    \ detected during development submission\",\n      \"default\": false\n    },\n\
    \    \"showroomType\": {\n      \"type\": \"string\",\n      \"description\":\
    \ \"Showroom type (classic or zero_touch)\"\n    },\n    \"intakeType\": {\n \
    \     \"type\": \"string\",\n      \"description\": \"Intake type (new or migration)\"\
    ,\n      \"default\": \"new\"\n    },\n    \"assetTitle\": {\n      \"type\":\
    \ \"string\",\n      \"description\": \"Asset title for pre-intake\"\n    },\n\
    \    \"contentOutline\": {\n      \"type\": \"string\",\n      \"description\"\
    : \"Content outline for pre-intake\"\n    },\n    \"learningObjectives\": {\n\
    \      \"type\": \"string\",\n      \"description\": \"Learning objectives for\
    \ pre-intake\"\n    },\n    \"associatedOpportunities\": {\n      \"type\": \"\
    string\",\n      \"description\": \"Associated opportunities for pre-intake\"\n\
    \    },\n    \"salesPlayTdp\": {\n      \"type\": \"string\",\n      \"description\"\
    : \"Sales play TDP for pre-intake\"\n    },\n    \"aiRelated\": {\n      \"type\"\
    : \"boolean\",\n      \"description\": \"Whether the content is AI-related\",\n\
    \      \"default\": false\n    },\n    \"gpuNeeded\": {\n      \"type\": \"boolean\"\
    ,\n      \"description\": \"Whether GPU is needed\",\n      \"default\": false\n\
    \    },\n    \"maasInstead\": {\n      \"type\": \"boolean\",\n      \"description\"\
    : \"Use MaaS instead of CNV\",\n      \"default\": false\n    },\n    \"partnersAccess\"\
    : {\n      \"type\": \"boolean\",\n      \"description\": \"Whether partners need\
    \ access\",\n      \"default\": false\n    },\n    \"cloudProvider\": {\n    \
    \  \"type\": \"string\",\n      \"description\": \"Cloud provider (cnv, aws, etc.)\"\
    \n    },\n    \"clusterType\": {\n      \"type\": \"string\",\n      \"description\"\
    : \"Cluster type (sno, multinode)\"\n    },\n    \"ocpVersion\": {\n      \"type\"\
    : \"string\",\n      \"description\": \"OpenShift version\"\n    },\n    \"automationType\"\
    : {\n      \"type\": \"string\",\n      \"description\": \"Automation type (ansible,\
    \ terraform, etc.)\"\n    },\n    \"initiativeKey\": {\n      \"type\": \"string\"\
    ,\n      \"description\": \"Initiative key (rh1_2027, etc.)\"\n    },\n    \"\
    teamMembers\": {\n      \"type\": \"array\",\n      \"items\": {\n        \"type\"\
    : \"object\",\n        \"properties\": {\n          \"user\": {\n            \"\
    type\": \"string\"\n          },\n          \"access\": {\n            \"type\"\
    : \"string\"\n          }\n        }\n      },\n      \"description\": \"Team\
    \ members for collaboration\"\n    }\n  }\n}\n"
kind: ConfigMap
metadata:
  name: workflow-input-schema
  namespace: publishing-house
  annotations:
